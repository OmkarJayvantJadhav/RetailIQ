version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
# RetailIQ Platform — Docker Compose
# Full-stack: PostgreSQL + pgAdmin + FastAPI Backend
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: retailiq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retailiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql
      - ./database/views.sql:/docker-entrypoint-initdb.d/03_views.sql
      - ./database/stored_procedures.sql:/docker-entrypoint-initdb.d/04_stored_procedures.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailiq_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── pgAdmin Web Interface ────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: retailiq_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@retailiq.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailiq_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/retailiq_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: retailiq_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: retailiq-super-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: 60
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailiq_frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
